en:{orderLookup:"Estimate shipping by order number →",title:"Shipping estimate",intro:"Select purchased items and stored inventory to estimate international shipping in one box.",brand:"Parcel Note",badge:"Sample goods · demo rates",origin:"From",korea:"South Korea",destination:"Ship to",country:{JP:"Japan",TW:"Taiwan",HK:"Hong Kong",US:"United States"},pick:"Items to ship",unitLabel:"Choose quantities",tabs:["Purchased · inbound","Stored inventory"],hints:["Enter purchased clothing by type. Add stored items from the next tab.","Choose from the sample warehouse stock. Your inbound selection is included in the same box."],names:["T-shirt","Knitwear","Denim pants","Jacket"],each:"Each",available:"In stock",pieces:"pcs",clear:"Clear selection",selected:"Total selected",box:"Enter box dimensions",boxhint:"If you know the packed dimensions, enter all three sides. Otherwise the estimate uses item weights and sample packaging.",dims:["Length","Width","Height"],result:"Estimated international freight",demo:"Demo rate · one box",nn:"Selected items",weights:"Estimated packed weight",charged:"Chargeable weight",dim:"Volumetric weight",noDim:"Not entered",amountEmpty:"Select items",choose:"Select a quantity to see an estimate.",under:"The demo supports one box up to 20 kg. Reduce the quantity and try again.",over:"Quote required",wrong:"Enter all three dimensions, each between 1 and 150 cm.",check:"Check dimensions",note:"Covers estimated international freight at dispatch. Procurement fees, duties, taxes, and regional or special surcharges are excluded.",share:"Copy quote link",copied:"Link copied with your selected quantities.",manual:"Copy the address below.",offline:"Share links are available when hosted online.",warn:"Development preview. Item weights and route rates are synthetic. Actual charges depend on measured weight and dimensions after packing.",badLink:"Unsupported quote link. Default selections have been loaded.",langBtn:"한국어",shareTitle:"Quote address",clearAnn:"All inbound and stored quantities have been cleared.",quantity:"Quantity",minus:"Decrease",plus:"Increase",sample:"Inbound and stored combined",basis:"How this is calculated",rules:"We add the low and high sample garment weights separately, plus 0.2 kg for packaging. When dimensions are provided, we compare each weight with volume in cm³ ÷ 5,000 and round the higher weight up to 0.5 kg. Each destination uses synthetic rates."}

const makeDefault=()=>({to:"JP",lang:"ko",tab:0,qty:[[2,0,0,0],[0,0,0,0]],dims:["","",""]});
function dimsStatus(values){if(values.every(x=>x===""))return {volume:null};if(values.some(x=>!/^\d{1,3}(?:\.\d{1,2})?$/.test(x)||!Number.isFinite(Number(x))||Number(x)<1||Number(x)>150))return {error:true};return {volume:values.reduce((n,x)=>n*Number(x),1)/5000};}
function quote(s){
 const quantities=weights.map((_,i)=>s.qty[0][i]+s.qty[1][i]);const count=quantities.reduce((a,b)=>a+b,0);
 const dim=dimsStatus(s.dims);if(dim.error)return {state:"wrong",count};if(!count)return {state:"empty",count,volume:dim.volume};
 const packed=[0,1].map(k=>(200+quantities.reduce((g,q,i)=>g+q*Math.round(weights[i][k]*1000),0))/1000);
 const charged=packed.map(k=>Math.ceil(Math.max(k,dim.volume||0)*2-1e-9)/2);
 if(charged[1]>20)return {state:"over",count,packed,charged,volume:dim.volume};
 const r=routes[s.to];const amounts=charged.map(k=>r.base+(k*2-1)*r.step);return {state:"ok",count,packed,charged,amounts,volume:dim.volume};
}
function encode(s){const p=new URLSearchParams({v:"1",to:s.to,lang:s.lang,tab:String(s.tab),q:s.qty.flat().join(",")});if(s.dims.every(x=>x!==""))p.set("cm",s.dims.join(","));return "#"+p.toString();}
function decode(hash){const s=makeDefault();if(!hash||hash==="#")return {s};try {if(hash.length>370)throw 0;const p=new URLSearchParams(hash.slice(1));const keys=[...p.keys()];if(keys.some(k=>!["v","to","lang","tab","q","cm"].includes(k))||new Set(keys).size!==keys.length||p.get("v")!=="1"||!Object.hasOwn(routes,p.get("to"))||!["ko","en"].includes(p.get("lang"))||!["0","1"].includes(p.get("tab")))throw 0;
 const q=(p.get("q")||"").split(",");if(q.length!==8||q.some((x,i)=>!/^\d{1,2}$/.test(x)||Number(x)>caps[Math.floor(i/4)][i%4]))throw 0;
 const dims=p.has("cm")?p.get("cm").split(","):["","",""];if(dims.length!==3|| (p.has("cm")&&dims.some(x=>!/^\d{1,3}(?:\.\d{1,2})?$/.test(x)))||dimsStatus(dims).error)throw 0;
 return {s:{to:p.get("to"),lang:p.get("lang"),tab:Number(p.get("tab")),qty:[q.slice(0,4).map(Number),q.slice(4).map(Number)],dims}};
 }catch{return {s,bad:true}}}
function boot(){
 const $=id=>document.getElementById(id);const initial=decode(location.hash);let s=initial.s;let notice=initial.bad?"badLink":"";let currentLink="";

 function renderItems(){const lang=t();$("items").replaceChildren();lang.names.forEach((name,i)=>{const row=document.createElement("div");row.className="item";row.innerHTML='<i class="swatch" aria-hidden="true"></i><div><strong></strong><small></small></div><div class="qty"><button type="button">−</button><output></output><button type="button">+</button></div>';const color=row.querySelector(".swatch");color.style.setProperty("--c",palette[i][0]);color.style.setProperty("--d",palette[i][1]);row.querySelector("strong").textContent=name;row.querySelector("small").textContent=lang.each+" "+weights[i].map(w).join("–")+" kg"+(s.tab?" · "+lang.available+" "+caps[1][i]:"");const buttons=row.querySelectorAll("button");buttons.forEach((b,j)=>{b.setAttribute("aria-label",name+" "+(j?lang.plus:lang.minus));b.onclick=()=>{s.qty[s.tab][i]+=j?1:-1;edit();}});$("items").append(row);});}
 function paint(){const lang=t();document.documentElement.lang=s.lang;document.title=lang.title+" · Parcel Note";document.querySelectorAll("[data-label]").forEach(el=>el.textContent=lang[el.dataset.label]);$("destination").replaceChildren(...Object.keys(routes).map(k=>new Option(lang.country[k],k)));$("destination").value=s.to;document.querySelectorAll("[data-tab]").forEach((b,i)=>{b.textContent=lang.tabs[i];b.setAttribute("aria-pressed",String(i===s.tab))});$("hint").textContent=lang.hints[s.tab];[0,1,2].forEach(i=>{$("dimlabel"+i).textContent=lang.dims[i]+" (cm)";$("dim"+i).value=s.dims[i]});renderItems();results();}
 function results(){const lang=t(),r=quote(s);const countText=r.count+" "+lang.pieces;$("picked").textContent=lang.selected+" "+countText;$("num").textContent=countText;$("packed").textContent=kg(r.packed);$("charged").textContent=kg(r.charged);$("volume").textContent=r.state==="wrong"?"—":r.volume==null?lang.noDim:w(r.volume)+" kg";$("price").textContent=r.state==="ok"?(r.amounts[0]===r.amounts[1]?money(r.amounts[0]):money(r.amounts[0])+" – "+w(r.amounts[1])):r.state==="empty"?lang.amountEmpty:r.state==="over"?lang.over:lang.check;$("ticketmeta").textContent=r.state==="over"?lang.under:r.state==="empty"?lang.choose:r.state==="wrong"?lang.wrong:lang.demo;$("dimError").textContent=r.state==="wrong"?lang.wrong:"";for(let i=0;i<3;i++)$("dim"+i).setAttribute("aria-invalid",String(r.state==="wrong"));$("share").disabled=r.state!=="ok";$("clear").disabled=!r.count;Array.from($("items").children).forEach((row,i)=>{const q=s.qty[s.tab][i];row.querySelector("output").textContent=q;const [minus,plus]=row.querySelectorAll("button");minus.disabled=q===0;plus.disabled=q>=caps[s.tab][i];});$("status").textContent=notice?lang[notice]:"";$("shareUrl").hidden=!currentLink;$("shareUrl").value=currentLink;$("shareUrl").setAttribute("aria-label",lang.shareTitle);}
 function edit(){notice="";currentLink="";results()}
 $("destination").onchange=e=>{s.to=e.target.value;edit()};$("lang").onclick=()=>{s.lang=s.lang==="ko"?"en":"ko";notice="";currentLink="";paint()};document.querySelectorAll("[data-tab]").forEach((b,i)=>b.onclick=()=>{s.tab=i;notice="";currentLink="";paint()});for(let i=0;i<3;i++)$("dim"+i).oninput=e=>{s.dims[i]=e.target.validity.badInput?"?":e.target.value;edit()};
 $("clear").onclick=()=>{s.qty=[[0,0,0,0],[0,0,0,0]];edit();notice="clearAnn";results()};$("share").onclick=async()=>{if(quote(s).state!=="ok")return;if(!/^https?:$/.test(location.protocol)){notice="offline";results();return}const u=new URL(location.href);u.search="";u.hash=encode(s);currentLink=u.href;try{await navigator.clipboard.writeText(u.href);notice="copied"}catch{notice="manual"}results();if(notice==="manual")$("shareUrl").select()};window.addEventListener("hashchange",()=>{const next=decode(location.hash);s=next.s;notice=next.bad?"badLink":"";currentLink="";paint()});paint();
}
if(typeof document!=="undefined")boot();
