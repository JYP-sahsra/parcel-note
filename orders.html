<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>주문번호로 예상 배송비 조회 · Parcel Note</title><style>
:root{--ink:#243c2f;--brand:#254e3b;--bg:#f6f7ef;--line:#d5ddcd;--muted:#526457;--light:#e4f3b9;color-scheme:light}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;font:15px/1.6 "DM Sans","Malgun Gothic",Arial,sans-serif;background:var(--bg);color:var(--ink);word-break:keep-all}header{background:#fffefa;border-bottom:1px solid var(--line)}.bar,main{max-width:1040px;margin:auto;padding:0 24px}.bar{height:63px;display:flex;align-items:center;justify-content:space-between}.logo{font-size:23px;font-weight:850;letter-spacing:-1.2px}.logo i{display:inline-block;width:18px;height:18px;border:5px solid var(--brand);border-radius:4px;transform:rotate(-12deg);margin-right:7px}.toplinks{display:flex;align-items:center;gap:12px}a{color:var(--brand)}button,select,input{font:inherit;color:inherit}button,select{cursor:pointer}button,input,select{border:1px solid #b9c7b6;border-radius:8px;padding:8px 12px;background:#fffefa}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #6b963d;outline-offset:3px}.hero{padding:34px 0 19px}.hero h1{font-size:clamp(28px,4.5vw,47px);letter-spacing:-.06em;line-height:1.15;margin:9px 0}.hero p{margin:0;color:var(--muted)}.tag{font-size:12px;font-weight:700;color:var(--brand);background:var(--light);border-radius:20px;padding:5px 10px}.grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(270px,1fr);gap:17px;align-items:start;padding:0 0 35px}.card{border:1px solid var(--line);background:#fffefa;border-radius:16px;margin:0 0 14px;padding:21px}.card h2{font-size:19px;letter-spacing:-.04em;margin:0 0 12px}.fields{display:flex;gap:8px}.fields input{min-width:0;flex:1}.cta{background:var(--brand);color:white;border-color:var(--brand);font-weight:700}.quiet{color:var(--brand);background:transparent;border:none;text-decoration:underline;padding:2px 0}.hint,.note{font-size:13px;color:var(--muted);margin:9px 0}.filters{display:flex;gap:15px;align-items:flex-end;flex-wrap:wrap}label{font-size:13px;font-weight:650;display:block}label>input,label>select{display:block;max-width:100%;margin-top:4px}#carriers{display:flex;gap:6px;flex-wrap:wrap;margin:5px 0 0}#carriers button[aria-pressed=true]{background:var(--brand);color:white;border:1px solid var(--brand)}.side{position:sticky;top:10px;overflow:hidden;padding:0}.ticket{background:var(--brand);color:white;padding:19px 22px}.ticket h2{font-size:16px;margin:0}.ticket strong{display:block;font-size:34px;letter-spacing:-.05em;margin:3px 0}.ticket p{font-size:13px;color:#dfead9;margin:0}.body{padding:14px 20px}.body p:empty{display:none}dl{display:grid;grid-template-columns:1fr auto;gap:5px 12px;margin:0}dt{color:var(--muted);font-size:14px}dd{margin:0;font-weight:700;text-align:right}details{margin-top:15px}summary{cursor:pointer;font-size:14px;font-weight:600}details dl{margin-top:10px}.share input{width:100%;margin-top:6px}#inv:not(:empty){padding:12px 0 0;border-top:1px solid var(--line)}@media(max-width:720px){.grid{grid-template-columns:1fr;gap:0}.bar,main{padding:0 15px}.hero{padding-top:24px}.card{padding:16px}.side{position:static;padding:0}.toplinks{gap:6px;font-size:12px}.fields{flex-wrap:wrap}.fields input{width:160px}.bar{height:54px}}</style></head><body>
<header><div class="bar"><span class="logo"><i></i>Parcel Note</span><div class="toplinks"><a href="index.html" data-key="manual"></a><button id="lang" type="button" data-key="lang"></button></div></div></header>
<main><section class="hero"><span class="tag" id="badge"></span><h1 data-key="title"></h1><p data-key="intro"></p></section>
<div class="grid"><div><section class="card"><form id="lookup" autocomplete="off"><h2><label for="order" data-key="label"></label></h2><div class="fields"><input id="order" maxlength="40" autocomplete="off" spellcheck="false"><button class="cta" data-key="find"></button></div></form><p class="hint" id="privacy"></p><button type="button" class="quiet" id="sampleButton" data-key="sample"></button><p class="hint" data-key="sampleTip"></p></section>
<section class="card"><h2 data-key="stock"></h2><p id="notice" role="status"></p><dl id="inv"></dl></section><section class="card"><div class="filters"><label><span data-key="dest"></span><select id="country"></select></label><label id="custom" hidden><span data-key="code"></span><input id="countryCode" maxlength="2" placeholder="AU"></label></div><p class="hint" data-key="carrier"></p><div id="carriers"></div></section></div>
<aside class="card side"><div class="ticket"><h2 data-key="summary"></h2><strong id="money" aria-live="polite"></strong><p id="rateNote"></p></div><div class="body"><dl id="costs"></dl><p class="note" id="basis"></p><details id="extras"><summary data-key="detail"></summary><dl id="boxes"></dl></details><p class="note" data-key="method"></p><div class="share"><button class="quiet" id="shareButton" data-key="share"></button><p id="shareNotice" class="note" role="status"></p><input hidden readonly id="shareAddress" aria-label="URL"></div></div></aside></div></main>
<script src="orders.js"></script><script>mountOrders();</script></body></html>
